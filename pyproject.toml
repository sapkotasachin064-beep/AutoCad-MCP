[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autocad-mcp"
version = "0.3.0"
description = "MCP server that drives AutoCAD 2021+ over COM on Windows, with an optional headless DXF backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The server imports mcp.server.mcpserver, which exists only in MCP Python
    # SDK 2.x (V0.2.x declared mcp>=1.2.0 and failed at import on 1.x).
    # Developed and tested against 2.3.0.
    "mcp>=2.3,<3",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Headless DXF backend (AUTOCAD_MCP_BACKEND=dxf), DXF comparison and audit tools.
dxf = ["ezdxf>=1.3,<2"]
# PNG/PDF previews of DXF drawings (needs ezdxf's drawing add-on + matplotlib).
render = ["ezdxf>=1.3,<2", "matplotlib>=3.8"]
dev = ["pytest"]

[project.scripts]
autocad-mcp = "server:main"

[tool.setuptools]
# Flat src/ layout (V0.2.2). Installing exposes these as top-level modules and
# packages, so install into a dedicated virtual environment.
package-dir = { "" = "src" }
packages = ["backends", "core", "domain", "tools", "utils"]
py-modules = ["cad_engine", "db", "server", "version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside ezdxf's Matrix44 under NumPy 2.5; third-party, not this project's code.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
